[build]
builder = "NIXPACKS"

[deploy]
startCommand = "python manage.py repair_legacy_db && python manage.py migrate --noinput && python manage.py collectstatic --noinput && python manage.py init_data && python manage.py createsuperuser --noinput || true && gunicorn config.wsgi:application --bind 0.0.0.0:$PORT"
