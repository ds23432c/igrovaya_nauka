{% extends 'base.html' %}
{% block title %}Редактировать профиль{% endblock %}
{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-7">
      <div class="card-game p-4 p-md-5">
        <h2 style="font-family:'Orbitron',sans-serif;font-weight:700;margin-bottom:2rem">✏️ Редактировать профиль</h2>
        <form method="post">
          {% csrf_token %}
          {% for field in form %}
          <div class="mb-3">
            <label class="form-label fw-bold">{{ field.label }}</label>
            {{ field }}
            {% if field.errors %}<div class="text-danger small mt-1">{{ field.errors.0 }}</div>{% endif %}
          </div>
          {% endfor %}
          <div class="d-flex gap-3 mt-4">
            <button type="submit" class="btn btn-primary px-4"><i class="bi bi-check me-1"></i>Сохранить</button>
            <a href="{% url 'accounts:profile' %}" class="btn btn-outline-secondary px-4">Отмена</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
